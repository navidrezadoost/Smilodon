name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test
      - name: Install browsers
        run: npx playwright install --with-deps
      - name: E2E tests
        run: |
          set -o pipefail
          mkdir -p ci-diagnostics
          npm run test:e2e 2>&1 | tee ci-diagnostics/e2e.log
      - name: Upload Playwright failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-diagnostics
          path: |
            ci-diagnostics/e2e.log
            test-results/
            playwright-report/
          if-no-files-found: warn
      - name: Bundle size (gzipped)
        run: |
          ls -lh dist/smilodon.js || true
          npm run size
