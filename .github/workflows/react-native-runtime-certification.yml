name: React Native Android Runtime Certification

on:
  pull_request:
    paths:
      - '.github/workflows/react-native-runtime-certification.yml'
      - 'packages/core/**'
      - 'packages/react-native/**'
      - 'scripts/certify-react-native-android.mjs'
      - 'scripts/install-gradle-distribution.mjs'
      - 'tests/react-native-runtime/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-runtime:
    name: Packed React Native bridge on Android API 35
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore checksum-pinned Gradle distribution cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gradle-8.10.2-bin.zip
          key: gradle-8.10.2-bin-sha256-31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26
          save-always: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: tests/react-native-runtime/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install checksum-pinned Gradle distribution with controlled fallback
        id: gradle
        run: node scripts/install-gradle-distribution.mjs

      - name: Pin fixture package manager
        run: npm install --global npm@10.8.2

      - name: Verify pinned Node and npm toolchain
        run: |
          node --version
          npm --version
          test "$(node --version)" = 'v20.20.2'
          test "$(npm --version)" = '10.8.2'
          java --version

      - name: Install locked repository dependencies
        run: npm ci

      - name: Enable Android KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record pending emulator boot stage
        run: |
          mkdir -p test-results/react-native-runtime
          node -e "require('node:fs').writeFileSync('test-results/react-native-runtime/emulator-boot.json', JSON.stringify({stage:'emulator-boot',status:'pending',startedAt:new Date().toISOString(),apiLevel:35,target:'google_apis',arch:'x86_64',profile:'pixel_2'},null,2)+'\\n')"

      - name: Build packed packages and execute Android runtime scenarios
        id: emulator
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node scripts/certify-react-native-android.mjs

      - name: Record emulator runner outcome and preserve required failure
        if: always()
        env:
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'test-results/react-native-runtime/emulator-boot.json';
          let record = { stage: 'emulator-boot', startedAt: new Date().toISOString() };
          if (fs.existsSync(path)) record = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (process.env.EMULATOR_OUTCOME === 'success') {
            record.status = 'pass';
            record.finishedAt = new Date().toISOString();
          } else if (process.env.EMULATOR_OUTCOME === 'skipped') {
            record.status = 'skipped';
            record.failureCode = 'UPSTREAM_REQUIRED_STAGE_FAILED';
            record.failure = 'Emulator setup did not start because an earlier required workflow stage failed.';
            record.finishedAt = new Date().toISOString();
          } else if (!fs.existsSync('test-results/react-native-runtime/runtime-certification.json')) {
            record.status = 'fail';
            record.failureCode = 'ANDROID_EMULATOR_BOOT_OR_RUNNER_INFRASTRUCTURE';
            record.failure = 'Emulator runner failed before the certification runner wrote a runtime report.';
            record.finishedAt = new Date().toISOString();
          }
          fs.writeFileSync(path, JSON.stringify(record, null, 2) + '\n');
          NODE
          test "$EMULATOR_OUTCOME" = success

      - name: Preserve Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-native-android-runtime-evidence
          path: test-results/react-native-runtime/
          if-no-files-found: warn
          retention-days: 30
