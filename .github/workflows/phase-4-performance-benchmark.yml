name: Phase 4 Performance Baseline

on:
  push:
    branches:
      - codex/phase-4.6.2a-browser-benchmark-baselines
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      repetitions:
        description: Measured repetitions per dataset and render mode (release review should use at least 5)
        required: true
        type: number
        default: 5
      warmups:
        description: Warm-up runs per dataset and render mode (excluded from the report)
        required: true
        type: number
        default: 1

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  chromium-browser-benchmark:
    name: Chromium browser performance baseline (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CI: 'true'
      PHASE4_BENCHMARK_REPETITIONS: ${{ inputs.repetitions || 5 }}
      PHASE4_BENCHMARK_WARMUPS: ${{ inputs.warmups || 1 }}
      PHASE4_BENCHMARK_OUTPUT: test-results/performance/phase-4.6.2a.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright-pinned Chromium
        run: |
          set -o pipefail
          mkdir -p test-results/performance
          npx playwright install --with-deps chromium 2>&1 | tee test-results/performance/browser-install.log

      - name: Build component packages
        run: npm run build

      - name: Run report-only real-browser baseline
        run: |
          set -o pipefail
          npm run benchmark:phase4 2>&1 | tee test-results/performance/playwright.log

      - name: Summarize baseline
        if: always() && hashFiles('test-results/performance/phase-4.6.2a.json') != ''
        run: npm run benchmark:phase4:summary

      - name: Preserve browser benchmark data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-performance-baseline-${{ github.run_id }}
          path: test-results/performance/
          if-no-files-found: warn
          retention-days: 30

  core-stress-benchmark:
    name: Core stress targets (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repeated core stress targets
        run: |
          set -o pipefail
          mkdir -p test-results/performance/core-stress
          PHASE4_CORE_STRESS_WARMUPS=1 \
          PHASE4_CORE_STRESS_REPETITIONS=5 \
          PHASE4_CORE_STRESS_BENCHMARK_OUTPUT=test-results/performance/core-stress/phase-4.6.2a2-core-stress.json \
            npm run benchmark:core-stress 2>&1 | tee test-results/performance/core-stress/benchmark.log

      - name: Preserve core stress benchmark data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-core-stress-baseline-${{ github.run_id }}
          path: test-results/performance/core-stress/
          if-no-files-found: warn
          retention-days: 30

  lifecycle-memory-certification:
    name: EnhancedSelect lifecycle and memory certification (pinned Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PHASE4_LIFECYCLE_OUTPUT: test-results/performance/lifecycle/phase-4.6.2b-lifecycle.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright-pinned Chromium
        run: |
          set -o pipefail
          mkdir -p test-results/performance/lifecycle
          npx playwright install --with-deps chromium 2>&1 | tee test-results/performance/lifecycle/browser-install.log

      - name: Build component packages
        run: npm run build

      - name: Run lifecycle and memory certification
        run: |
          set -o pipefail
          mkdir -p test-results/performance/lifecycle
          npm run test:phase4:lifecycle 2>&1 | tee test-results/performance/lifecycle/playwright.log

      - name: Preserve lifecycle measurements and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-lifecycle-memory-${{ github.run_id }}
          path: test-results/performance/lifecycle/
          if-no-files-found: warn
          retention-days: 30
